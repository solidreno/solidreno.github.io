<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#db2777" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Background Board -->
  <rect width="512" height="512" rx="120" fill="url(#bg-grad)" />
  
  <!-- Dice 1 (Underneath/Tilted) -->
  <g transform="translate(100, 100) rotate(-15) scale(1.05)" filter="url(#shadow)">
    <rect x="0" y="0" width="200" height="200" rx="40" fill="#ffffff" />
    <!-- Three dots -->
    <circle cx="50" cy="50" r="18" fill="#db2777" />
    <circle cx="150" cy="150" r="18" fill="#db2777" />
    <circle cx="100" cy="100" r="18" fill="#db2777" />
  </g>

  <!-- Dice 2 (Top/Tilted) -->
  <g transform="translate(200, 200) rotate(12) scale(1.05)" filter="url(#shadow)">
    <rect x="0" y="0" width="200" height="200" rx="40" fill="#ffffff" />
    <!-- Five dots -->
    <circle cx="50" cy="50" r="16" fill="#4f46e5" />
    <circle cx="150" cy="50" r="16" fill="#4f46e5" />
    <circle cx="50" cy="150" r="16" fill="#4f46e5" />
    <circle cx="150" cy="150" r="16" fill="#4f46e5" />
    <circle cx="100" cy="100" r="20" fill="#e11d48" /> <!-- Accent center dot -->
  </g>
</svg>
